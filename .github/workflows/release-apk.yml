name: Real Android APK Automatic Release Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Real Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Complete Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle Build Engine
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Prepare Environment Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: 🔑 Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🛠️ Compile Real Android APK from Codebase
        run: gradle assembleDebug --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}

      - name: 🔍 Verify & Package Real APK Binary (>1MB Validation)
        run: |
          RAW_BRANCH="${GITHUB_REF_NAME}"
          BRANCH_SLUG=$(echo "${RAW_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/--/g')
          
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$ORIGINAL_APK" ]; then
            echo "❌ ERROR: $ORIGINAL_APK does not exist! Compilation failed."
            exit 1
          fi

          FILE_SIZE=$(wc -c < "$ORIGINAL_APK")
          echo "Compiling complete... Output APK size: ${FILE_SIZE} bytes."

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ ERROR: Compiled APK file size (${FILE_SIZE} bytes) is less than 1MB. Not a real APK binary!"
            exit 1
          fi

          RAW_MSG=$(git log -1 --pretty=format:"%s")
          CLEAN_TITLE=$(echo "${RAW_MSG}" | sed -E 's/^(feat|fix|perf|docs|chore|ci|refactor)(\([^)]+\))?: //i')

          if [ "${RAW_BRANCH}" = "main" ]; then
            VERSION_TAG="v1.0.${{ github.run_number }}"
            RELEASE_TITLE="KhataTrack ${VERSION_TAG} — ${CLEAN_TITLE} 🚀"
            APK_NAME="KhataTrack-SouvikDey-main-${VERSION_TAG}.apk"
          else
            VERSION_TAG="${BRANCH_SLUG}-v1.0.${{ github.run_number }}"
            RELEASE_TITLE="KhataTrack [${RAW_BRANCH}] ${VERSION_TAG} — ${CLEAN_TITLE} 🧪"
            APK_NAME="KhataTrack-SouvikDey-${BRANCH_SLUG}-${VERSION_TAG}.apk"
          fi

          cp "$ORIGINAL_APK" "${APK_NAME}"
          
          echo "RAW_BRANCH=${RAW_BRANCH}" >> $GITHUB_ENV
          echo "BRANCH_SLUG=${BRANCH_SLUG}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "CLEAN_TITLE=${CLEAN_TITLE}" >> $GITHUB_ENV
          echo "APK_FILE=${APK_NAME}" >> $GITHUB_ENV
          echo "APK_SIZE_BYTES=${FILE_SIZE}" >> $GITHUB_ENV

      - name: 🤖 Intelligent Release Notes Engine
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          PREV_BRANCH_TAG=$(git describe --tags --match="${BRANCH_SLUG}*" --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_BRANCH_TAG" ]; then
            RANGE="${PREV_BRANCH_TAG}..HEAD"
          else
            RANGE="HEAD~5..HEAD"
          fi

          FEATS=$(git log ${RANGE} --grep="^feat" --pretty=format:"- 🎨 **%s** (\`%h\`)" 2>/dev/null || echo "")
          FIXES=$(git log ${RANGE} --grep="^fix" --pretty=format:"- 🐛 **%s** (\`%h\`)" 2>/dev/null || echo "")
          PERFS=$(git log ${RANGE} --grep="^perf" --pretty=format:"- ⚡ **%s** (\`%h\`)" 2>/dev/null || echo "")
          DOCS=$(git log ${RANGE} --grep="^docs" --pretty=format:"- 📝 **%s** (\`%h\`)" 2>/dev/null || echo "")
          CHORES=$(git log ${RANGE} --grep="^\(chore\|ci\|build\)" --pretty=format:"- 📦 **%s** (\`%h\`)" 2>/dev/null || echo "")
          
          ALL_COMMITS=$(git log ${RANGE} --oneline --no-merges -n 10 | sed 's/^/- 💡 /')
          FILE_CHANGES=$(git diff HEAD~1 --stat | head -n 25 | sed 's/^/  /')
          CHANGES_STAT=$(git log -1 --stat --oneline | tail -n 1)

          cat <<EOF > release_notes.md
          # 💸 KhataTrack Release ${RELEASE_TAG} — ${CLEAN_TITLE} 🚀

          ### 📱 Direct APK Asset Download
          👉 **[Download ${APK_FILE}](https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${APK_FILE})**

          ---

          ## 🌟 Key Feature & Improvement Highlights
          **Primary Focus**: \`${COMMIT_SUBJECT}\`

          ${COMMIT_BODY:-"This release incorporates certified codebase updates compiled directly into the production-ready Android APK binary."}

          ---

          ## 📱 App Version & APK Metadata Verification

          - **Version Name**: \`1.0.${{ github.run_number }}\`
          - **Version Code**: \`${{ github.run_number }}\`
          - **Target Branch**: \`${RAW_BRANCH}\`
          - **APK Asset Binary**: \`${APK_FILE}\`
          - **Verified Binary Size**: \`${APK_SIZE_BYTES}\` bytes (~$(expr ${APK_SIZE_BYTES} / 1048576) MB)
          - **Maintainer**: **Souvik Dey** ([@imsovikde](https://github.com/imsovikde))
          - **Latest Commit**: \`${COMMIT_HASH}\` — **${COMMIT_SUBJECT}**
          - **Build Timestamp**: ${BUILD_DATE}
          - **Compatibility**: Android 7.0+ (API 24 to 36)

          ---

          ## 🔍 File-Level Code Changes & Modified Components

          \`\`\`text
          ${FILE_CHANGES:-"  No single file stat available."}
          \`\`\`

          ---

          ### 📋 Detailed Commit Categorization

          ${FEATS:-"- 🎨 Feature updates compiled into codebase."}
          ${FIXES:-"- 🐛 Bug fixes & test stability enhancements."}
          ${PERFS:-"- ⚡ Compose UI & Room database optimizations."}
          ${DOCS:-"- 📝 Documentation & setup guidelines."}
          ${CHORES:-"- 📦 Gradle build dependencies & CI workflow updates."}

          ---

          ### 📜 Commit History in this Build
          ${ALL_COMMITS}

          ---

          > [!NOTE]
          > All previous real APK versions remain archived and downloadable anytime in the [Releases History Archive](https://github.com/${{ github.repository }}/releases).

          *Engineered & compiled directly for Souvik Dey by KhataTrack Release Engine.*
          EOF

      - name: 🚀 Publish Real Release with APK Asset via GH CLI
        run: |
          gh release create "${RELEASE_TAG}" "${APK_FILE}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            --target "${RAW_BRANCH}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Sync Live Release Badges & Real-Time Data to README
        run: |
          if [ "${RAW_BRANCH}" = "main" ]; then
            sed -i -E "s/Latest%20Release-v[0-9\.]*/Latest%20Release-${RELEASE_TAG}/g" README.md
            sed -i -E "s/Download Latest APK \(v[0-9\.]*\)/Download Latest APK (${RELEASE_TAG})/g" README.md

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            if ! git diff --staged --quiet; then
              git commit -m "docs: sync live release ${RELEASE_TAG} metadata to README [skip ci]"
              git push origin HEAD:${RAW_BRANCH}
            fi
          fi
