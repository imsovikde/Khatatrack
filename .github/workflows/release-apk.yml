name: Intelligent Branch-Scoped Real-Time APK Release Engine

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Branch-Scoped Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Engine
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment Properties
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Compile Android APK
        run: gradle assembleDebug --no-daemon

      - name: Compute Branch-Scoped Version & Package APK
        run: |
          RAW_BRANCH="${GITHUB_REF_NAME}"
          BRANCH_SLUG=$(echo "${RAW_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/--/g')
          
          if [ "${RAW_BRANCH}" = "main" ]; then
            VERSION_TAG="v1.0.${{ github.run_number }}"
            RELEASE_TITLE="KhataTrack Main Release ${VERSION_TAG} 🚀"
            APK_NAME="KhataTrack-SouvikDey-main-${VERSION_TAG}.apk"
          else
            VERSION_TAG="${BRANCH_SLUG}-v1.0.${{ github.run_number }}"
            RELEASE_TITLE="KhataTrack [${RAW_BRANCH}] Release ${VERSION_TAG} 🧪"
            APK_NAME="KhataTrack-SouvikDey-${BRANCH_SLUG}-${VERSION_TAG}.apk"
          fi

          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          
          echo "RAW_BRANCH=${RAW_BRANCH}" >> $GITHUB_ENV
          echo "BRANCH_SLUG=${BRANCH_SLUG}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "APK_FILE=${APK_NAME}" >> $GITHUB_ENV

      - name: Intelligent Branch Release Notes Engine
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          PREV_BRANCH_TAG=$(git describe --tags --match="${BRANCH_SLUG}*" --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_BRANCH_TAG" ]; then
            RANGE="${PREV_BRANCH_TAG}..HEAD"
          else
            RANGE="HEAD~5..HEAD"
          fi

          FEATS=$(git log ${RANGE} --grep="^feat" --pretty=format:"- 🎨 %s (\`%h\`)" 2>/dev/null || echo "")
          FIXES=$(git log ${RANGE} --grep="^fix" --pretty=format:"- 🐛 %s (\`%h\`)" 2>/dev/null || echo "")
          PERFS=$(git log ${RANGE} --grep="^perf" --pretty=format:"- ⚡ %s (\`%h\`)" 2>/dev/null || echo "")
          DOCS=$(git log ${RANGE} --grep="^docs" --pretty=format:"- 📝 %s (\`%h\`)" 2>/dev/null || echo "")
          CHORES=$(git log ${RANGE} --grep="^\(chore\|ci\|build\)" --pretty=format:"- 📦 %s (\`%h\`)" 2>/dev/null || echo "")
          ALL_COMMITS=$(git log ${RANGE} --oneline --no-merges -n 10 | sed 's/^/- 💡 /')
          CHANGES_STAT=$(git log -1 --stat --oneline | tail -n 1)

          cat <<EOF > release_notes.md
          # 💸 KhataTrack Intelligent Release [${RAW_BRANCH}] ${RELEASE_TAG} 🚀

          ### 📱 Download Branch APK File
          👉 **[Download ${APK_FILE}](https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${APK_FILE})**

          ---

          ## 🧠 Branch-Scoped Commitment Summary

          - **Target Branch**: \`${RAW_BRANCH}\`
          - **APK Package Name**: \`${APK_FILE}\`
          - **Maintainer**: **Souvik Dey** ([@imsovikde](https://github.com/imsovikde))
          - **Latest Commit**: \`${COMMIT_HASH}\` — **${COMMIT_MSG}**
          - **Build Timestamp**: ${BUILD_DATE}
          - **Code Changes Stat**: \`${CHANGES_STAT}\`
          - **Branch Isolation**: Scoped exclusively to branch \`${RAW_BRANCH}\` (does not overwrite other branches).

          ---

          ### 📋 Categorized Branch Changes

          ${FEATS:-"- 🎨 Feature changes on branch `${RAW_BRANCH}`."}
          ${FIXES:-"- 🐛 Bug fixes & enhancements on branch `${RAW_BRANCH}`."}
          ${PERFS:-"- ⚡ Performance optimizations on branch `${RAW_BRANCH}`."}
          ${DOCS:-"- 📝 Documentation updates on branch `${RAW_BRANCH}`."}
          ${CHORES:-"- 📦 Dependencies & build config updates on branch `${RAW_BRANCH}`."}

          ---

          ### 📜 Branch Recent Commit History
          ${ALL_COMMITS}

          ---

          > [!NOTE]
          > All previous APK versions for this and other branches remain archived and accessible in the [Releases History Section](https://github.com/${{ github.repository }}/releases).

          *Automated by KhataTrack Intelligent Release Engine for Souvik Dey.*
          EOF

      - name: Publish Branch-Scoped Release via GH CLI
        run: |
          gh release create "${RELEASE_TAG}" "${APK_FILE}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            --target "${RAW_BRANCH}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
