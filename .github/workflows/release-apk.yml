name: Intelligent Real-Time APK Release Engine

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Intelligent Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Engine
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment Properties
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Compile Android APK
        run: gradle assembleDebug --no-daemon

      - name: Package Versioned APK with Maintainer Name
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          APK_NAME="KhataTrack-SouvikDey-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "APK_FILE=${APK_NAME}" >> $GITHUB_ENV

      - name: Intelligent Release Notes Engine
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~5..HEAD"
          fi

          FEATS=$(git log ${RANGE} --grep="^feat" --pretty=format:"- 🎨 %s (\`%h\`)" 2>/dev/null || echo "")
          FIXES=$(git log ${RANGE} --grep="^fix" --pretty=format:"- 🐛 %s (\`%h\`)" 2>/dev/null || echo "")
          PERFS=$(git log ${RANGE} --grep="^perf" --pretty=format:"- ⚡ %s (\`%h\`)" 2>/dev/null || echo "")
          DOCS=$(git log ${RANGE} --grep="^docs" --pretty=format:"- 📝 %s (\`%h\`)" 2>/dev/null || echo "")
          CHORES=$(git log ${RANGE} --grep="^\(chore\|ci\|build\)" --pretty=format:"- 📦 %s (\`%h\`)" 2>/dev/null || echo "")
          ALL_COMMITS=$(git log ${RANGE} --oneline --no-merges -n 10 | sed 's/^/- 💡 /')
          CHANGES_STAT=$(git log -1 --stat --oneline | tail -n 1)

          cat <<EOF > release_notes.md
          # 💸 KhataTrack Intelligent Release ${RELEASE_TAG} 🚀

          ### 📱 Download Android APK File
          👉 **[Download ${APK_FILE}](https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${APK_FILE})**

          ---

          ## 🧠 Intelligent Commitment Release Notes

          #### ⚡ Latest Commitment Summary
          - **APK Package Name**: \`${APK_FILE}\`
          - **Maintainer**: **Souvik Dey** ([@imsovikde](https://github.com/imsovikde))
          - **Latest Commit**: \`${COMMIT_HASH}\` — **${COMMIT_MSG}**
          - **Build Timestamp**: ${BUILD_DATE}
          - **Code Changes Stat**: \`${CHANGES_STAT}\`
          - **Target Environment**: Android 7.0+ (API 24 to 36)

          ---

          ### 📋 Categorized Commitment Changes

          ${FEATS:-"- 🎨 General feature enhancements and UI updates."}
          ${FIXES:-"- 🐛 Bug fixes, stability patches, and null-safety improvements."}
          ${PERFS:-"- ⚡ Performance optimizations & Jetpack Compose rendering speedups."}
          ${DOCS:-"- 📝 Documentation, README polish & AGENTS.md guidelines."}
          ${CHORES:-"- 📦 Gradle build config, dependencies & workflow updates."}

          ---

          ### 📜 Full Recent Commit History
          ${ALL_COMMITS}

          ---

          > [!NOTE]
          > All previous APK versions remain archived and accessible in the [Releases History Section](https://github.com/${{ github.repository }}/releases).

          *Automated by KhataTrack Intelligent Release Engine for Souvik Dey.*
          EOF

      - name: Publish GitHub Release with APK Asset via GH CLI
        run: |
          gh release create "${RELEASE_TAG}" "${APK_FILE}" \
            --title "KhataTrack ${RELEASE_TAG} 🚀" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
