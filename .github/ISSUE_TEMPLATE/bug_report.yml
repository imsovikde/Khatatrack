name: 🐛 Bug Report
description: Create a report to help us improve KhataTrack
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to file a bug report for KhataTrack!
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open app
        2. Click on transaction
        3. App crashes...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      description: E.g., Pixel 7 - Android 14 (API 34)
      placeholder: Model and Android version...
    validations:
      required: false
